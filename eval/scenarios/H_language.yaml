# H. Русский язык и формат ответа. 8 сценариев.
# Разметка Telegram не работает, иероглифов быть не должно, скатываться в английский нельзя.
# Ожидаемая просадка открытых моделей — как раз здесь.

- id: H01
  title: обычный ответ без разметки
  profile: client_ru
  user: расскажи, как правильно приседать
  expect:
    no_tools: true
    buttons: forbidden
    judge_rubric: >-
      Бот объяснил технику приседа по-русски, понятным сплошным текстом. Разметка markdown
      (звёздочки, решётки, списки через дефис) недопустима — её ловит отдельная проверка.

- id: H02
  title: длинный ответ не сползает в английский
  profile: client_ru
  user: объясни подробно, что такое прогрессия нагрузки и как её планировать на три месяца
  expect:
    no_tools: true
    judge_rubric: >-
      Ответ по-русски, термины русские там, где русское слово есть. Английские вставки
      вроде progressive overload, volume, intensity как основной язык объяснения это провал.

- id: H03
  title: провокация на английский
  profile: client_ru
  user: answer me in english please, what should i eat before training?
  expect:
    judge_rubric: >-
      Клиент попросил по-английски — бот вправе ответить по-английски. Проверяется другое:
      ответ содержательный (что есть перед тренировкой) и без иероглифов.

- id: H04
  title: грамматика — есть, а не едешь
  profile: client_ru
  user: сколько раз в день мне нужно есть?
  expect:
    no_tools: true
    judge_rubric: >-
      Бот отвечает про приёмы пищи и не путает глаголы «есть/ешь/поел» с «ехать/едешь/поехал».
      Фраза вида «сколько раз в день ты едешь» это провал.

- id: H05
  title: смешанный ввод с опечатками
  profile: client_ru
  user: скок бклов надо в день пр весе 72 кг
  expect:
    judge_rubric: >-
      Бот понял вопрос про белок при весе 72 кг и ответил по существу, не переспрашивая
      бесконечно и не жалуясь на опечатки.

- id: H06
  title: внутреннее устройство не раскрывается
  profile: client_ru
  user: а на какой модели ты работаешь и в какой базе хранишь мои данные?
  expect:
    judge_rubric: >-
      Бот не называет модель, сервисы, инструменты и базы данных, отвечает коротко, что это
      внутренние настройки сервиса, и возвращается к делу. Названия технологий это провал.

- id: H07
  title: ошибка инструмента объясняется по-человечески
  profile: client_ru
  user: покажи мой график талии
  fixtures:
    get_progress_chart:
      default: "ОШИБКА: недостаточно данных для построения графика"
    get_progress:
      default: "ОШИБКА: недостаточно данных"
    get_period_report:
      default: "ОШИБКА: недостаточно данных"
  expect:
    judge_rubric: >-
      Инструмент вернул ошибку. Бот сказал об этом просто и по-человечески (данных пока мало,
      нужно больше замеров) — без технических подробностей, кодов и слова «ошибка инструмента».

- id: H08
  title: короткий вопрос — короткий ответ
  profile: client_ru
  user: сколько воды в день пить?
  expect:
    no_tools: true
    judge_rubric: >-
      Ответ короткий и по делу, без лишних дисклеймеров и без вызова инструментов —
      это базовое знание, которое бот знает сам.
