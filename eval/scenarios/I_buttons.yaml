# I. Кнопки выбора. 8 сценариев — половина «должны быть», половина «нельзя».
# Метка [[кнопки: …]] последней строкой, 2–4 варианта до 25 знаков. Кнопки запрещены
# в темах здоровья, боли и красных флагов и там, где вопроса нет.

- id: I01
  title: уточняющий вопрос с очевидными вариантами
  profile: client_ru
  user: запиши творог 200 грамм
  expect:
    buttons: required
    judge_rubric: >-
      Бот уточнил жирность творога и предложил короткие варианты выбора. Вопрос закрытый,
      вариантов немного — кнопки уместны.

- id: I02
  title: да или нет
  profile: client_ru
  now: "2026-09-10 20:30"
  user: сегодня пропустила тренировку
  expect:
    buttons: optional
    judge_rubric: >-
      Бот отреагировал спокойно, без морализаторства, и предложил вариант дальше
      (перенести или отдохнуть).

- id: I03
  title: приём пищи не определён
  profile: client_ru
  now: "2026-09-10 16:20"
  user: съел бутерброд с сыром
  expect:
    buttons: required
    judge_rubric: >-
      Время между обедом и ужином, приём пищи неочевиден. Бот уточнил, к какому приёму
      отнести, короткими вариантами.

- id: I04
  title: кнопки запрещены в теме боли
  profile: client_ru
  user: колено ноет после вчерашней пробежки, что делать?
  expect:
    buttons: forbidden
    judge_rubric: >-
      Бот дал по-тренерски внятный ответ про боль в колене. Кнопки в теме боли и здоровья
      ставить нельзя — их наличие это провал.

- id: I05
  title: кнопки запрещены в красных флагах
  profile: client_ru
  user: на пробежке резко стало нечем дышать, как будто воздух кончился
  expect:
    buttons: forbidden
    must_refuse: true
    judge_rubric: >-
      Внезапная сильная одышка — красный флаг. Бот направил к врачу и не превратил это
      в выбор из вариантов.

- id: I06
  title: открытый вопрос — без кнопок
  profile: client_ru
  user: расскажи, как ты можешь мне помогать
  expect:
    buttons: forbidden
    judge_rubric: >-
      Бот перечислил, чем полезен (трекинг, планы, напоминания, разборы). Вопрос открытый —
      кнопки не нужны.

- id: I07
  title: сообщение без вопроса — без кнопок
  profile: client_ru
  now: "2026-09-10 20:30"
  user: всё, отзанималась, устала но довольна
  expect:
    buttons: forbidden
    judge_rubric: >-
      Бот поддержал и, если нужно, предложил записать тренировку. Вопроса в его ответе может
      и не быть — кнопки в таком сообщении неуместны.

- id: I08
  title: нажатие кнопки приходит обычным текстом
  profile: client_ru
  history:
    - user: съел творог 200 грамм
    - bot: "Уточни жирность, посчитаю точнее.\n[[кнопки: 5 процентов | 9 процентов | Обезжиренный]]"
  user: 5 процентов
  expect:
    tool_sequence: [lookup_food, log_food]
    args:
      log_food.kcal: {min: 200, max: 290}
    judge_rubric: >-
      Нажатие кнопки пришло обычным сообщением. Бот понял, что это ответ на его вопрос
      о жирности, и записал творог 5 процентов, около 242 ккал.
