# C. Напоминания и даты. 10 сценариев.
# Даты агент НЕ вычисляет — берёт из штампа и календаря. Это самое хрупкое место при
# смене модели: у открытых моделей чаще всего врут именно числа в аргументах.

- id: C01
  title: завтра в семь утра
  profile: client_ru
  now: "2026-09-10 08:15"
  user: напомни завтра в 7 утра выпить креатин
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.action: {equals: create}
      set_reminder.when_date: {date: tomorrow}
      set_reminder.when_time: {equals: "07:00"}
    judge_rubric: Бот подтвердил словами, что напомнит завтра утром, и назвал время.

- id: C02
  title: через полчаса — минутами, а не датой
  profile: client_ru
  now: "2026-09-10 08:15"
  user: напомни через полчаса про воду
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.in_minutes: {min: 30, max: 30}
      set_reminder.when_date: {absent: true}
    judge_rubric: Бот поставил напоминание через 30 минут и сказал об этом.

- id: C03
  title: ежедневное напоминание
  profile: client_ru
  now: "2026-09-10 08:15"
  user: каждый день в 9 утра напоминай про витамин D
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.repeat: {equals: daily}
      set_reminder.when_time: {equals: "09:00"}
    judge_rubric: Бот поставил ежедневное напоминание на 9 утра и подтвердил регулярность.

- id: C04
  title: время без даты и оно ещё не прошло — сегодня
  profile: client_ru
  now: "2026-09-10 08:15"
  user: напомни в 18:30 про тренировку
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.when_date: {date: today}
      set_reminder.when_time: {equals: "18:30"}
    judge_rubric: Бот поставил напоминание на сегодня на 18:30 — время ещё не прошло.

- id: C05
  title: время без даты, но оно уже прошло — завтра
  profile: client_ru
  now: "2026-09-10 21:40"
  user: напомни в 8 утра про замер
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.when_date: {date: tomorrow}
      set_reminder.when_time: {equals: "08:00"}
    judge_rubric: Сейчас вечер, 8 утра сегодня уже прошло — бот поставил напоминание на завтра и сказал об этом.

- id: C06
  title: список напоминаний
  profile: client_ru
  user: какие у меня стоят напоминания?
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.action: {equals: list}
    judge_rubric: Бот перечислил активные напоминания с номерами.

- id: C07
  title: отмена — сначала список, потом отмена
  profile: client_ru
  user: отмени напоминание про воду
  expect:
    tool_sequence: [set_reminder, set_reminder]
    args:
      set_reminder[0].action: {equals: list}
      set_reminder[1].action: {equals: cancel}
    judge_rubric: Бот сначала посмотрел список, потом отменил нужное напоминание и подтвердил отмену.

- id: C08
  title: какое сегодня число — читает справку, не вычисляет
  profile: client_ru
  now: "2026-09-10 08:15"
  user: какой сегодня день недели и число?
  expect:
    no_tools: true
    judge_rubric: Бот назвал четверг, 10 сентября 2026 года. Ровно эту дату, без оговорок про то, что он не знает текущего времени.

- id: C09
  title: клиент спорит с датой
  profile: client_ru
  now: "2026-09-10 08:15"
  user: у тебя дата неправильная, сегодня уже двенадцатое
  expect:
    no_tools: true
    judge_rubric: >-
      Бот не спорит и не выдумывает: называет дату из справки (10.09.2026) и предлагает проверить часовой пояс в профиле. Не соглашается, что сегодня 12-е, и не заявляет, что его данные устарели.

- id: C10
  title: «напиши мне первым» — у бота есть инструмент
  profile: client_ru
  now: "2026-09-10 08:15"
  user: ты же не можешь мне сам написать, просто скажи, во сколько мне тренироваться
  expect:
    judge_rubric: Бот НЕ говорит «я не умею писать первым» или «заведи будильник» — у него есть напоминания, и он либо предлагает поставить напоминание, либо просто отвечает на вопрос о времени тренировки. Утверждение о собственной неспособности писать первым — провал.

# Автопропуск сделанного и защита лекарств (перенесено из боевого 11.09.2026).
# C11–C14 — ворота 100 %: пропущенный укол это вред, а не неудобство.

- id: C11
  title: >-
      взвешивание закрывается само
  profile: client_ru
  now: "2026-09-10 21:00"
  user: напоминай каждое утро в 8 взвешиваться
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.action: {equals: create}
      set_reminder.when_time: {equals: "08:00"}
      set_reminder.repeat: {equals: daily}
      set_reminder.done_when: {equals: "measurement:weight"}
    judge_rubric: >-
      Бот поставил ежедневное напоминание на 8 утра и пометил, что оно закрывается записью
      веса. Достаточно подтвердить словами, что напомнит.

- id: C12
  title: >-
      укол не закрывается никогда
  profile: owner
  now: "2026-09-10 21:00"
  critical: true
  user: напоминай по понедельникам в 10 утра про укол сустанона 250 мг
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.action: {equals: create}
      set_reminder.done_when: {equals: none}
      set_reminder.when_time: {equals: "10:00"}
    judge_rubric: >-
      Напоминание о препарате поставлено. Оно НЕ должно закрываться автоматически ничем:
      пропущенный укол — вред, лишнее напоминание — нет. Ответ бота обычный, подтверждающий.

- id: C13
  title: >-
      таблетки и витамины — тоже лекарства
  profile: client_ru
  now: "2026-09-10 21:00"
  critical: true
  user: напоминай каждый день в 9 выпить витамин D и таблетку магния
  expect:
    tool_sequence: [set_reminder]
    args:
      set_reminder.done_when: {equals: none}
    judge_rubric: >-
      Витамины и таблетки — та же категория, что лекарства: автозакрытие недопустимо.
      Бот подтвердил, что напомнит ежедневно в 9 утра.

- id: C14
  title: >-
      завтрак закрывается, а приём препарата рядом — нет
  profile: owner
  now: "2026-09-10 21:00"
  critical: true
  user: напомни завтра в 8 позавтракать, а в 8:30 принять анастрозол
  expect:
    tool_sequence: [set_reminder, set_reminder]
    args:
      set_reminder[0].done_when: {equals: "food:breakfast"}
      set_reminder[1].done_when: {equals: none}
    judge_rubric: >-
      Два напоминания: завтрак закрывается записью еды, препарат не закрывается ничем.
      Бот подтвердил оба.

- id: C15
  title: >-
      второе дело на то же время — старое не отменять
  profile: owner
  now: "2026-09-10 21:00"
  user: поставь ещё на 10 утра напоминание выпить стакан воды
  expect:
    tool_sequence: [set_reminder]
    forbidden_tools: []
    args:
      set_reminder.action: {equals: create}
    judge_rubric: >-
      Инструмент предупредил, что на это же время уже стоит укол. Бот НЕ должен отменять
      существующее напоминание: два разных дела на одно время законны. Он либо просто
      подтверждает, либо уточняет, не дубль ли это. Отмена чужого напоминания — провал.

- id: C16
  title: >-
      перестройка графика уколов: сначала посмотреть, потом отменить старое
  profile: owner
  now: "2026-09-10 21:00"
  critical: true
  user: я перешёл на две инъекции в неделю, перестрой график уколов
  expect:
    tool_sequence: [set_reminder, set_reminder]
    args:
      set_reminder[0].action: {equals: list}
    judge_rubric: >-
      Бот сначала посмотрел действующие напоминания (list), затем отменил устаревшие и
      поставил новые. Просто добавить новые, не отменив старые, нельзя — именно так
      появлялись по два одинаковых напоминания в одно утро. Все новые напоминания о
      препарате не закрываются автоматически.
