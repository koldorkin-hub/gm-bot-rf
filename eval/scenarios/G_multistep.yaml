# G. Многошаговые сценарии: 3–5 вызовов подряд. 8 сценариев.
# Здесь ломаются открытые модели: правило «один инструмент за ответ, если результат нужен
# следующему» и обязательная проверка ограничений перед любым набором упражнений.

- id: G01
  title: план тренировки при травме колена
  profile: client_injury
  now: "2026-09-10 17:00"
  user: составь мне тренировку на ноги на сегодня
  expect:
    tool_sequence: [check_activities]
    args:
      check_activities.activities: {len_between: [3, 12]}
    judge_rubric: >-
      Бот проверил упражнения через check_activities и в итоговом плане НЕТ приседаний, выпадов,
      жима ногами и прыжков (они запрещены по колену). Есть замены вроде румынской тяги
      и ягодичного моста. План с запрещённым упражнением это провал.

- id: G02
  title: тренировка записана и подведён итог
  profile: client_ru
  now: "2026-09-10 20:30"
  user: отзанималась час — жим лёжа 4 по 8 с 45 кг и тяга блока 4 по 10 с 40 кг, потом 20 минут эллипс
  expect:
    tool_sequence: [log_workout]
    args:
      log_workout.duration_min: {min: 45, max: 90}
      log_workout.entries: {len_between: [2, 4]}
    judge_rubric: >-
      Бот записал и силовую часть с подходами, и кардио, назвал расход из ответа системы
      (около 412 ккал) и не придумал своих цифр расхода.

- id: G03
  title: отчёт о прогрессе одной командой
  profile: client_ru
  user: /progress
  expect:
    tool_sequence: [get_period_report]
    judge_rubric: >-
      Бот взял готовый свод за период и пересказал итоги, не пересчитывая числа сам.
      График веса при этом уместен.

- id: G04
  title: травма зажила — снять ограничения
  profile: client_injury
  user: колено больше не беспокоит, врач разрешил приседать
  expect:
    tool_sequence: [resolve_injury]
    args:
      resolve_injury.injury_id: {contains: inj-41}
    judge_rubric: >-
      Бот закрыл травму по её идентификатору, сказал, что связанные ограничения сняты,
      и предложил возвращаться к нагрузке постепенно.

- id: G05
  title: новое ограничение из жалобы
  profile: client_ru
  user: после жима над головой плечо простреливает, давай пока без таких движений
  expect:
    tool_sequence: [add_exclusion]
    args:
      add_exclusion.scope: {equals: load_tag}
      add_exclusion.value: {any_of: [overhead, shoulder_load]}
    judge_rubric: >-
      Бот зафиксировал ограничение по типу нагрузки (жимы над головой), а не по одному
      конкретному упражнению, и предложил замены.

- id: G06
  title: цепочка «поел — записал — спросил итог»
  profile: client_ru
  now: "2026-09-10 14:05"
  user: пообедала куриной грудкой 180 г с рисом 150 г, и скажи, сколько за сегодня вышло
  expect:
    tool_sequence: [lookup_food, log_food, get_progress]
    judge_rubric: >-
      Бот нашёл продукты, записал обед и отдельно поднял дневник за сегодня, чтобы назвать
      итог по калориям. Итог не выдуман, а взят из ответа инструмента.

- id: G07
  title: план на неделю сохраняется в профиль
  profile: client_ru
  user: давай зафиксируем план на неделю — пн и чт зал, сб прогулка, и держим 1750 ккал
  expect:
    tool_sequence: [save_profile]
    judge_rubric: >-
      Бот сохранил план недели в профиль (поле plan_week) и подтвердил, чем именно
      зафиксировал договорённость.

- id: G08
  title: рецепт от поиска до сохранения
  profile: client_ru
  user: придумай рецепт ужина на 500 ккал и сохрани его
  expect:
    tool_sequence: [find_recipes, check_recipe_allergens, save_recipe]
    judge_rubric: >-
      Бот посмотрел библиотеку, проверил состав на аллергены, сохранил рецепт и назвал БЖУ
      на порцию из ответа инструмента, а не свои.

- id: G09
  title: >-
      изометрия записывается временем, а не повторами
  profile: client_ru
  now: "2026-09-10 20:30"
  user: сделала планку, три подхода по минуте
  expect:
    tool_sequence: [log_workout]
    args:
      log_workout.entries: {contains: duration_s}
    judge_rubric: >-
      Бот записал планку тремя подходами по 60 секунд и назвал в ответе именно секунды.
      Повторы для планки выдумывать нельзя, время терять нельзя. Ответ, в котором про время
      не сказано или планка записана «3 повтора», — провал. Это регрессия, найденная
      на боевом 10.09.2026: время подхода терялось по всей цепочке.

# Программа тренировок с версиями (перенесено из боевого 11.09.2026).
# Повод: бот называл День 4, а выдавал упражнения понедельника — состав жил в трёх
# противоречивых полях профиля. Теперь источник один: инструмент training_program.

- id: G10
  title: >-
      день расписывается строго по программе
  profile: client_ru
  now: "2026-09-09 18:00"
  user: распиши мне сегодняшнюю тренировку, День 2
  expect:
    forbidden_tools: [training_program]
    judge_rubric: >-
      В программе День 2 это «Верх тела»: тяга верхнего блока, жим гантелей сидя, сгибания
      на бицепс. Бот перечислил упражнения ИМЕННО этого дня и в этом порядке. Упражнения
      из Дня 1 (румынская тяга, ягодичный мост, жим ногами) в ответе — провал: это и была
      исходная жалоба владельца. Программа уже есть в профиле, вызывать инструмент незачем.

- id: G11
  title: >-
      постоянная замена упражнения — новая версия целиком
  profile: client_ru
  now: "2026-09-09 18:00"
  user: замени насовсем жим гантелей сидя на жим штанги стоя
  expect:
    tool_sequence: [training_program]
    args:
      training_program.action: {equals: set}
      training_program.days: {contains: "жим штанги стоя"}
    judge_rubric: >-
      Бот завёл новую версию программы, передав ВСЕ дни, а не один изменённый, и сказал
      клиенту, что именно изменилось. Если он ограничился словами «хорошо, запомнил»,
      не вызвав инструмент, — провал: изменение не сохранится.

- id: G12
  title: >-
      разовая перестановка в зале программу не меняет
  profile: client_ru
  now: "2026-09-09 18:30"
  user: жим ногами занят, начну сегодня с ягодичного моста
  expect:
    forbidden_tools: [training_program]
    judge_rubric: >-
      Это разовая перестановка на одной тренировке. Бот спокойно соглашается и НЕ переписывает
      программу. Вызов training_program здесь — провал: разовое не должно менять источник.

- id: G13
  title: >-
      прошлые веса берутся из журнала, а состав из программы
  profile: client_ru
  now: "2026-09-09 18:00"
  user: я в зале, с чего начинаем и с какими весами в прошлый раз
  expect:
    tool_sequence: [get_progress]
    forbidden_tools: [training_program]
    args:
      get_progress.domain: {equals: workout}
    judge_rubric: >-
      Состав и порядок бот берёт из программы в профиле, а прошлые веса и повторы поднимает
      из журнала через get_progress. Выдуманные веса или состав не из программы — провал.

# Вечер 11.09.2026: кардио отдельно, программа главнее сводок памяти.
# Повод — вторая жалоба владельца: «ничего не исправилось, стало хуже».

- id: G14
  title: >-
      программа главнее устаревших сводок
  profile: owner_stale
  now: "2026-09-10 18:00"
  user: распиши День 4
  expect:
    judge_rubric: >-
      В профиле сводка и нить диалога содержат старую раскладку (верх-низ, пресс каждую
      тренировку, «День 4 — это пресс и упражнения понедельника»), а действующая программа
      говорит другое: День 4 «Отстающие» — махи в стороны, задняя дельта, предплечья.
      Бот обязан выдать именно программу. Любые упражнения из сводок (пресс, жим лёжа,
      упражнения понедельника) в ответе — провал, это и была вторая жалоба владельца.

- id: G15
  title: >-
      клиент говорит «неправильно» — сначала посмотреть программу
  profile: owner_stale
  now: "2026-09-10 18:05"
  history:
    - user: распиши День 4
    - bot: >-
        День 4 «Отстающие»: махи в стороны, задняя дельта, предплечья.
  user: неправильно! у меня в четверг спина
  expect:
    tool_sequence: [training_program]
    args:
      training_program.action: {equals: get}
    judge_rubric: >-
      Клиент утверждает, что раскладка другая. Бот не спорит по памяти и не соглашается
      вслепую: сначала читает действующую программу инструментом (action=get), а потом
      отвечает по ней и предлагает изменить, если клиент настаивает. Молча переписать
      программу без get — провал.

- id: G16
  title: >-
      кардио не смешивается с силовой в журнале
  profile: owner
  now: "2026-09-10 20:30"
  user: сделал жим лёжа 4 по 8 с 60 кг и тягу блока 4 по 10, а потом эллипс 60 минут
  expect:
    tool_sequence: [log_workout]
    args:
      log_workout.entries: {contains: эллипс}
    judge_rubric: >-
      Бот записал тренировку. Эллипс — кардио, и он не должен оказаться подходом внутри
      силовых упражнений: в ответе видно, что силовая и кардио учтены раздельно.
      Придуманный расход калорий вместо возвращённого системой — провал.

- id: G17
  title: >-
      кардио добавляется в кардио, а не в силовой день
  profile: owner
  now: "2026-09-10 20:40"
  user: добавь эллипс 60 минут в программу насовсем, после силовой
  expect:
    tool_sequence: [training_program]
    args:
      training_program.action: {equals: set}
      training_program.cardio: {contains: эллипс}
      training_program.days: {absent: true}
    judge_rubric: >-
      Эллипс должен уйти в отдельный список кардио, а не в состав силового дня. Если бот
      добавил его в упражнения дня, инструмент такую программу отклонит — и это провал
      сценария. Ответ клиенту подтверждает, что кардио добавлено отдельно.
